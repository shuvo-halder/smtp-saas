[program:mailsaas-policy]
process_name=%(program_name)s
# Adjust /var/www/mailsaas to your actual production deployment path
command=php /var/www/mailsaas/artisan policy:serve --host=127.0.0.1 --port=10031
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/mailsaas/storage/logs/policy.log
stopwaitsecs=15
