[program:mailsaas-worker]
process_name=%(program_name)s_%(process_num)02d
# Adjust /var/www/mailsaas to your actual production deployment path
command=php /var/www/mailsaas/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=8
redirect_stderr=true
stdout_logfile=/var/www/mailsaas/storage/logs/worker.log
stopwaitsecs=3600
