# =============================================================================
# 10-mail.conf — Dovecot Mailbox Location
# =============================================================================

# Maildir format in /var/mail/vhosts/<domain>/<user>/
mail_location = maildir:/var/mail/vhosts/%d/%n

# Run as vmail user
mail_uid = vmail
mail_gid = vmail

# Allow vmail to access all mailboxes
first_valid_uid = 5000

# Mailbox directories to auto-create
namespace inbox {
  inbox = yes
  mailbox Drafts     { special_use = \Drafts;    auto = subscribe; }
  mailbox Junk       { special_use = \Junk;      auto = subscribe; }
  mailbox Sent       { special_use = \Sent;      auto = subscribe; }
  mailbox "Sent Messages" { special_use = \Sent; }
  mailbox Trash      { special_use = \Trash;     auto = subscribe; }
  mailbox Archive    { special_use = \Archive;   auto = subscribe; }
}

# Enable quota plugin
mail_plugins = $mail_plugins quota
