# =============================================================================
# dovecot.conf — Main Dovecot Configuration
# =============================================================================

# Protocols to enable
protocols = imap lmtp

# Listen on all interfaces
listen = *, ::

# Log file
log_path = /var/log/dovecot.log
info_log_path = /var/log/dovecot-info.log

# Include conf.d directory
!include conf.d/*.conf
!include_try local.conf
