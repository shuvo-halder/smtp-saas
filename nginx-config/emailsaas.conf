# =============================================================================
# Nginx Configuration — Email SaaS Platform
# Files: /etc/nginx/sites-available/emailsaas
# =============================================================================

# ─── Rate limiting zones ──────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=panel_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# ─── Redirect HTTP → HTTPS ────────────────────────────────────────────────────
server {
    listen 80;
    server_name panel.yourdomain.com webmail.yourdomain.com;
    return 301 https://$host$request_uri;
}

# ─── Laravel Panel — panel.yourdomain.com ─────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name panel.yourdomain.com;

    root   /var/www/emailsaas/laravel-panel/public;
    index  index.php;

    # SSL
    ssl_certificate     /etc/letsencrypt/live/panel.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE+AESGCM:ECDHE+AES256:!aNULL;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Rate limiting on auth endpoints
    location ~ ^/(login|register|password) {
        limit_req zone=login_limit burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # General rate limiting
    location / {
        limit_req zone=panel_limit burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Block sensitive files
    location ~ /\.(env|git|htaccess) { deny all; }
    location ~ ^/(composer|artisan|server) { deny all; }

    # Upload limit (for large email attachments via panel)
    client_max_body_size 50M;

    access_log /var/log/nginx/panel.access.log;
    error_log  /var/log/nginx/panel.error.log;
}

# ─── Roundcube Webmail — webmail.yourdomain.com ───────────────────────────────
server {
    listen 443 ssl http2;
    server_name webmail.yourdomain.com;

    root  /var/lib/roundcube;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/webmail.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webmail.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Block Roundcube internal folders
    location ~ ^/(config|temp|logs|bin|SQL)/ { deny all; }
    location ~ /\. { deny all; }

    client_max_body_size 25M;

    access_log /var/log/nginx/webmail.access.log;
    error_log  /var/log/nginx/webmail.error.log;
}
